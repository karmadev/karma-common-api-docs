<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karma API Documentation</title>
  <meta name="description" content="API documentation for the Karma platform">
  <link rel="icon" href="https://karma.life/favicon.ico">
  <style>
    body { margin: 0; padding: 0; }
    .version-selector {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: #1a1a2e;
      padding: 8px 12px;
      border-radius: 6px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
    }
    .version-selector select {
      background: #16213e;
      color: #fff;
      border: 1px solid #0f3460;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .version-selector label {
      color: #e94560;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="version-selector">
    <label for="version">API Version:</label>
    <select id="version" onchange="switchVersion(this.value)">
      <option value="latest">Latest</option>
    </select>
  </div>

  <script id="api-reference"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const specPath = params.get('spec') || 'latest/openapi.json';

    function switchVersion(version) {
      const path = version === 'latest' ? 'latest' : `versions/${version}`;
      window.location.href = `?spec=${path}/openapi.json`;
    }

    fetch('./versions/manifest.json')
      .then(r => r.json())
      .then(manifest => {
        const select = document.getElementById('version');
        manifest.versions.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          if (v === manifest.latest) opt.textContent += ' (latest)';
          select.appendChild(opt);
        });
      })
      .catch(() => {});

    function loadScalar() {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@scalar/api-reference';
      document.body.appendChild(s);
    }

    // Merge a partial OpenAPI fragment ({ tag, paths, components.schemas })
    // into the live spec. Mutates `spec` in place.
    function mergeFragment(spec, fragment) {
      if (fragment.tag) {
        spec.tags = spec.tags || [];
        spec.tags.push(fragment.tag);
      }
      if (fragment.paths) {
        spec.paths = spec.paths || {};
        Object.assign(spec.paths, fragment.paths);
      }
      if (fragment.components && fragment.components.schemas) {
        spec.components = spec.components || {};
        spec.components.schemas = spec.components.schemas || {};
        Object.assign(spec.components.schemas, fragment.components.schemas);
      }
    }

    Promise.all([
      fetch('./' + specPath).then(r => r.json()),
      fetch('./custom-integrations/voucher-provider.openapi.json').then(r => r.json()),
      fetch('./custom-integrations/loyalty-provider.openapi.json').then(r => r.json()),
    ])
      .then(([spec, voucherFragment, loyaltyFragment]) => {
        const existingTagNames = (spec.tags || []).map(t => t.name);

        mergeFragment(spec, voucherFragment);
        mergeFragment(spec, loyaltyFragment);

        // Group sidebar: keep existing 45 tags under "API Reference",
        // put the new contracts under "Custom Integrations".
        spec['x-tagGroups'] = [
          { name: 'API Reference', tags: existingTagNames },
          { name: 'Custom Integrations', tags: ['Custom Voucher Provider', 'Custom Loyalty Provider'] },
        ];

        const ref = document.getElementById('api-reference');
        ref.dataset.configuration = JSON.stringify({ content: spec });
        loadScalar();
      })
      .catch((err) => {
        console.warn('Custom Integrations injection failed, loading plain spec:', err);
        const ref = document.getElementById('api-reference');
        ref.dataset.url = './' + specPath;
        loadScalar();
      });
  </script>
</body>
</html>
