<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karma API Documentation</title>
  <meta name="description" content="API documentation for the Karma platform">
  <link rel="icon" href="https://karma.life/favicon.ico">
  <style>
    body { margin: 0; padding: 0; }
    .version-selector {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: #1a1a2e;
      padding: 8px 12px;
      border-radius: 6px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
    }
    .version-selector select {
      background: #16213e;
      color: #fff;
      border: 1px solid #0f3460;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .version-selector label {
      color: #e94560;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="version-selector">
    <label for="version">API Version:</label>
    <select id="version" onchange="switchVersion(this.value)">
      <option value="latest">Latest</option>
    </select>
  </div>

  <script id="api-reference"></script>

  <script>
    // Determine which OpenAPI spec to load (default: latest)
    const params = new URLSearchParams(window.location.search);
    const specPath = params.get('spec') || 'latest/openapi.json';
    const specBase = specPath.replace(/\/[^/]+$/, '');

    function switchVersion(version) {
      const path = version === 'latest' ? 'latest' : `versions/${version}`;
      window.location.href = `?spec=${path}/openapi.json`;
    }

    // Populate version selector
    fetch('./versions/manifest.json')
      .then(r => r.json())
      .then(manifest => {
        const select = document.getElementById('version');
        manifest.versions.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          if (v === manifest.latest) opt.textContent += ' (latest)';
          select.appendChild(opt);
        });
      })
      .catch(() => {});

    // Strip the back-link line from standalone-page markdown so it doesn't
    // appear inside the Scalar render.
    const stripBack = (md) => md.replace(/^\s*\[← Back[^\]]*\]\([^)]*\)\s*\n+/, '');

    // Load the OpenAPI spec, splice in the Custom Integrations guides as
    // tag-only sidebar entries grouped under "Custom Integrations", then hand
    // the result to Scalar via inline content.
    Promise.all([
      fetch('./' + specPath).then(r => r.json()),
      fetch('./custom-integrations/voucher-provider.md').then(r => r.text()),
      fetch('./custom-integrations/loyalty-provider.md').then(r => r.text()),
    ])
      .then(([spec, voucherMd, loyaltyMd]) => {
        const guideTags = [
          { name: 'Custom Voucher Provider', description: stripBack(voucherMd) },
          { name: 'Custom Loyalty Provider', description: stripBack(loyaltyMd) },
        ];

        spec.tags = (spec.tags || []).concat(guideTags);

        // Preserve any existing tag groups; append a "Custom Integrations"
        // group that surfaces the two guide tags in the sidebar.
        const existingGroups = spec['x-tagGroups'] || [];
        spec['x-tagGroups'] = existingGroups.concat([
          {
            name: 'Custom Integrations',
            tags: guideTags.map(t => t.name),
          },
        ]);

        const ref = document.getElementById('api-reference');
        ref.dataset.configuration = JSON.stringify({ content: spec });

        // Load Scalar after the spec is prepared so it picks up the inline content.
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@scalar/api-reference';
        document.body.appendChild(s);
      })
      .catch((err) => {
        // If guide fetch fails, fall back to plain spec so the API ref still loads.
        console.warn('Failed to inject custom integration guides, falling back:', err);
        const ref = document.getElementById('api-reference');
        ref.dataset.url = './' + specPath;
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@scalar/api-reference';
        document.body.appendChild(s);
      });
  </script>
</body>
</html>
